name: Mobile — iOS

on:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ios.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ios.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --fatal-infos

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Build IPA (no code sign)
        working-directory: mobile
        run: flutter build ipa --no-codesign --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-ios
          path: mobile/build/ios/ipa/*.ipa
          retention-days: 14

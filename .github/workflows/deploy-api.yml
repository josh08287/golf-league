name: Deploy API

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: |
          dotnet test tests/GolfLeague.Functions.Tests/GolfLeague.Functions.Tests.csproj \
            --configuration Release \
            --settings tests/GolfLeague.Functions.Tests/coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory ./test-results \
            --logger "trx;LogFileName=results.trx"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: test-results/results.trx
          reporter: dotnet-trx

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          ~/.dotnet/tools/reportgenerator \
            -reports:"test-results/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"HtmlInline_AzurePipelines;Cobertura;MarkdownSummaryGithub"

      - name: Publish coverage summary
        if: always()
        run: cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 30

      - name: Publish
        run: |
          dotnet publish src/GolfLeague.Functions/GolfLeague.Functions.csproj \
            --configuration Release \
            --output ./api-publish

      - name: Zip publish output
        run: cd api-publish && zip -r ../api.zip .

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: golf-league-fn-g5vkqe
          package: api.zip
          publish-profile: ${{ secrets.AZURE_FUNCTIONS_PUBLISH_PROFILE }}

      # Migrations/seeding no longer run automatically on Function host cold start
      # (that would wake the SQL Serverless DB from auto-pause far more often than
      # real deploys happen). Run them once here instead, right after each deploy.
      # Retries with backoff: right after a deploy the host is still cold-starting
      # (and the SQL Serverless DB may itself be resuming from auto-pause), so an
      # immediate call can transiently 503.
      - name: Apply database migrations
        run: |
          url="https://golf-league-fn-g5vkqe.azurewebsites.net/api/admin/migrate?code=${{ secrets.ADMIN_MIGRATE_FUNCTION_KEY }}"
          for attempt in 1 2 3 4 5 6; do
            if curl -sS -X POST -f "$url"; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 20s..."
            sleep 20
          done
          echo "All attempts failed."
          exit 1

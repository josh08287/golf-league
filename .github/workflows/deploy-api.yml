name: Deploy API

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'tests/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Test
        run: |
          dotnet test tests/GolfLeague.Functions.Tests/GolfLeague.Functions.Tests.csproj \
            --configuration Release \
            --settings tests/GolfLeague.Functions.Tests/coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory ./test-results \
            --logger "trx;LogFileName=results.trx"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: test-results/results.trx
          reporter: dotnet-trx

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          ~/.dotnet/tools/reportgenerator \
            -reports:"test-results/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"HtmlInline_AzurePipelines;Cobertura;MarkdownSummaryGithub"

      - name: Publish coverage summary
        if: always()
        run: cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 30

      - name: Publish
        run: |
          dotnet publish src/GolfLeague.Functions/GolfLeague.Functions.csproj \
            --configuration Release \
            --output ./api-publish

      - name: Zip publish output
        run: cd api-publish && zip -r ../api.zip .

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: golf-league-fn-g5vkqe
          package: api.zip
          publish-profile: ${{ secrets.AZURE_FUNCTIONS_PUBLISH_PROFILE }}

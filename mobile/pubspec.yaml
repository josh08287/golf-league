name: golf_league
description: Golf league manager
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Navigation
  go_router: ^14.2.0
  # HTTP
  dio: ^5.4.3+1
  # Auth
  flutter_appauth: ^8.0.1
  flutter_secure_storage: ^9.2.2
  # Local DB
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  # Cache
  hive_flutter: ^1.1.0
  # Push notifications
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.2
  flutter_local_notifications: ^17.1.2
  # Code gen models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  # Charts
  fl_chart: ^0.68.0
  # Connectivity
  connectivity_plus: ^6.0.3
  # JWT decode
  dart_jsonwebtoken: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

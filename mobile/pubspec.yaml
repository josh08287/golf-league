name: golf_league
description: Golf league manager
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.5
  flutter: ^3.41.8

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^3.3.1
  # Navigation
  go_router: ^17.2.2
  # HTTP
  dio: ^5.5.0
  # Auth
  flutter_appauth: ^12.0.0
  flutter_secure_storage: ^10.0.0
  # Local DB
  drift: ^2.32.1
  sqlite3_flutter_libs: ^0.6.0
  path_provider: ^2.1.3
  path: ^1.9.0
  # Cache
  hive_flutter: ^1.1.0
  # Push notifications
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0
  # Code gen models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  # Charts
  fl_chart: ^1.2.0
  # Connectivity
  connectivity_plus: ^7.1.1
  intl: ^0.20.2
  # JWT decode
  dart_jsonwebtoken: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.7.1
  drift_dev: ^2.32.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
